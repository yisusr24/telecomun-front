<app-navbar></app-navbar>

<div class="container my-4">
  <h2 class="title">Consumo histórico</h2>
  <br>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border"></div>
  </div>

  <div *ngIf="error && !loading" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="!loading && !error && data().length">
    <div class="card shadow-sm p-3 mb-4">
      <canvas #usageChart id="usageChart" height="120"></canvas>
    </div>

    <div class="table-responsive shadow-sm rounded-3">
      <table class="table align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Mes</th>
            <th class="text-end">Internet (MB)</th>
            <th class="text-end">Telefonía (min)</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of data()">
            <td>{{ r.month | date:'MMM y' }}</td>
            <td class="text-end">{{ r.internetMb | number }}</td>
            <td class="text-end">{{ r.phoneMinutes | number }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div *ngIf="!loading && !error && !data().length" class="alert alert-info">
    No hay registros de consumo.
  </div>
</div>
